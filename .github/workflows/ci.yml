# ============================================================
# AshenCourier —— CI
#
# 三个 job：
#   backend  快（~1 分钟）：gofmt / go vet / go test -race（含真 PG / 真 Redis 上的 store 集成测试）
#   frontend 快（~1 分钟）：typecheck / lint / build
#   smoke    慢（3–5 分钟，要真起 5 个容器）：端到端冒烟 + SPA 路由断言
#
# smoke 刻意只在 main 与手动触发时跑：`docker compose up -d --build` 要几分钟，
# 放进每个 PR 会把反馈时间拖垮。PR 走上面两个快 job。
#
# 与 PLAN-NEXT.md §4 的草稿相比修了四处（照抄草稿会跑不起来）：
#   1. smoke job 的 go 步骤必须在 backend/ 下执行（Go 模块在 backend/，不在仓库根）
#   2. 等待健康检查改用 curl 轮询 —— 草稿里 `grep -c '"A"|"B"'` 在 BRE 下 `|` 是字面量，永远匹配不到
#   3. pnpm/action-setup 显式给 version：仓库根没有 package.json，它读不到 packageManager 字段
#   4. frontend job 补上 pnpm build（全局 DoD 要求）
# ============================================================

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新推送取消上一轮未完成的运行，避免排队堆积
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend（fmt / vet / test -race + store 集成测试）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # store 的集成测试要真 PG 与真 Redis。用 Actions 的 service 容器而不是 compose：
    # compose 里的 postgres / redis 刻意不映射宿主端口（只 expose），宿主上的 go test 够不到它们。
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: ashen
          POSTGRES_PASSWORD: ashen
          POSTGRES_DB: ashen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ashen -d ashen_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # 真 Redis：store/redis 的结算脚本（一段 Lua）只有跑在真 Redis 上才有意义 ——
      # 纯 Go 单测只能断言脚本源码的字符串形状，改坏了也不一定红。
      # 不用 compose 的 redis，理由同 postgres：它不映射宿主端口。
      redis:
        image: redis:8.10-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # 未设置时集成测试会整体跳过 —— CI 里必须设置，否则等于没跑
      POSTGRES_TEST_DSN: postgres://ashen:ashen@localhost:5432/ashen_test?sslmode=disable
      # 同上：未设置时 internal/store/redis 的集成用例整体 SKIP
      REDIS_TEST_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod # 1.27.1
          cache-dependency-path: backend/go.sum

      # 不用 `test -z "$(gofmt -l .)"`：失败时看不到到底是哪个文件没格式化
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未通过 gofmt，请运行 gofmt -w："
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt 干净"

      - name: go vet
        run: go vet ./...

      # -race 需要 cgo；ubuntu-latest 自带 gcc，无需额外安装。
      # 这一条同时跑两个 store 的集成测试：POSTGRES_TEST_DSN 与 REDIS_TEST_ADDR 已注入；
      # 未注入时它们整体跳过（时间上能看出来 —— 真跑的话 internal/store/postgres 是秒级）。
      - name: go test -race（含 store 集成测试）
        run: go test -race -count=1 ./...

  frontend:
    name: frontend（typecheck / lint / build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      # 必须在 setup-node 之前：下面的 cache: pnpm 依赖已安装的 pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test # 纯函数单测（vitest run，非 watch）
      - run: pnpm lint
      # 零引用守卫：新加了 UI 组件却没接进视图、或照着 DESIGN.md 的字阶表把类补进
      # main.css 而没有使用点，人眼很难发现但产物里真实多字节 —— 让它变成 CI 会红的事。
      # 判定细节与「为什么不管 @theme token」见 frontend/scripts/check-zero-ref.mjs 的文件头。
      - run: pnpm audit:refs
      - run: pnpm build

  smoke:
    name: smoke（容器级端到端）
    # 只在 main 与手动触发时跑；PR 不跑（见文件头说明）
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # 浏览器级验收只用 Node 内置能力（fetch + WebSocket）打 CDP，
      # 所以这里**不需要 pnpm install**，e2e 目录也不装任何 npm 包。
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # compose 强制要求三个必填口令（缺一个直接拒绝启动），这里从模板造一份
      - name: 造 .env
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-postgres-pwd/" .env
          sed -i "s/^REDIS_PASSWORD=.*/REDIS_PASSWORD=ci-redis-pwd/" .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -base64 32)|" .env
          # DATABASE_URL 不用改：.env.example 里它写成 postgres://ashen:${POSTGRES_PASSWORD}@…，
          # compose 会展开这个引用。上面改了 POSTGRES_PASSWORD，它跟着就对了 ——
          # 反过来，如果这里还留着一行 sed 去改 DATABASE_URL 的字面量，就说明
          # 「两处各写一份口令」的坑还在（以前正是这么做的）。

      - name: docker compose up -d --build
        run: docker compose up -d --build

      - name: 等 /healthz 就绪（最多 3 分钟）
        run: |
          for i in $(seq 1 36); do
            if curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then
              echo "服务已就绪（第 $i 次探测）"
              break
            fi
            echo "第 $i 次探测未就绪，等待 5s…"
            sleep 5
          done
          # 探测循环本身不会失败退出：不显式再验一次，超时的症状会变成
          # 下一步浏览器脚本的报错（「连不上」），而不是「服务没起来」。
          if ! curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then
            echo "::error::栈在 3 分钟内未就绪，下面先看容器状态与日志"
            docker compose ps
            exit 1
          fi
          docker compose ps

      # ⚠️ 顺序不能颠倒：本步骤**必须**排在「端到端冒烟」之前。
      #    原因：POST /api/links 是 10 次/分钟/IP 的硬配额（写死在 config，不可用环境变量调整），
      #    而 cmd/smoke 的**最后一项检查**会故意把这配额打满（它要断言 429 + Retry-After）。
      #    先跑 smoke 的话，这里的创建请求一上来就是 429。
      #    本套件只花掉 1 个配额，而且它自己耗时约一分钟（26 次跳转 + 等明细落库），
      #    所以 smoke 开始时窗口已经滚过 —— 实测「e2e 19/19 → 紧接 smoke 27/27」。
      #    另外：万一本步骤提前失败，后续步骤不会执行，也就不会出现「级联失败」的误判。
      - name: 浏览器级验收（无头 Chrome + CDP，零依赖）
        run: node frontend/e2e/browser-check.mjs --base http://localhost:8080

      - name: 端到端冒烟（含 SPA 顶级路由断言）
        working-directory: backend
        run: go run ./cmd/smoke -base http://localhost:8080 -expect-spa

      - name: 失败时 dump 容器日志
        if: failure()
        run: docker compose logs --no-color --tail 200