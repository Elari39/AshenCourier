# ============================================================
# AshenCourier —— 安全响应头（**单一定义点**）
#
# 这个文件被 nginx.conf 用 `include` 引到**每一个自己写了 add_header 的层级**。
# 为什么必须是独立文件、而不是直接写在 server 块里：
#
#   ⚠️ nginx 的 `add_header` 是**替换，不是合并**。
#      官方原文：父层的 add_header **只在「当前层级没有 add_header」时**才被继承。
#      于是 `location ^~ /assets/` 为了 immutable 缓存头自己写了一条 add_header，
#      结果整批安全头在那里**静默消失** —— 页面正常、缓存正常，只有安全头没了，
#      而且 nginx -t 不会报任何东西。
#
#   它必须被 `include` 而不是复制粘贴，因为**两处各写一份迟早漂移**。
#   配套守卫：`backend/internal/httpx/nginx_headers_test.go` 会解析 nginx.conf 的块结构，
#   断言「**任何**含 add_header 的块里都必须有本文件的 include」—— 将来新增一个带
#   add_header 的 location 却忘了 include，`go test ./...` 会红。
#
# 全部带 `always`：否则 nginx 只给 2xx/3xx/204/301/302/304 加头，
# 而 404（短链失效页）、401（令牌过期）、503（依赖降级）恰恰是最需要它们的地方。
# ============================================================

# ---------- HSTS ----------
# max-age 一年。**这是一扇单向门**：浏览器一旦收到它，在 max-age 内对该主机
# （以及下面 includeSubDomains 覆盖的 `*.shorten.miku831.fun`）就**拒绝**走明文 HTTP；
# 想撤回只能再发一个 max-age=0，而「已经访问过的浏览器记住了」这件事本身撤不回来。
# 所以它只在「HTTPS 已经确定可用」时才该在场 —— 本站由 Cloudflare 提供 TLS，满足。
#
# 刻意**不加 `preload`**：preload 要求把域名提交进浏览器内置列表，撤出要等下一个
# 浏览器版本，比 max-age 更不可逆，而且提交有「覆盖全部子域 + 全站 HTTPS」的硬要求。
#
# 覆盖范围提醒：`includeSubDomains` 作用于**本主机的子域**（`*.shorten.miku831.fun`），
# **不会**波及 `miku831.fun` 的兄弟子域（例如 blog.）—— 所以这里带上它是安全的。
# 但它会覆盖本主机的新子域：将来若在 `shorten.miku831.fun` 下开一个只有 HTTP 的服务，
# 那台服务会被这条策略挡在门外。
#
# 走 HTTP（本地 `localhost:8080`）时发送这一行**没有副作用**：按 RFC 6797，
# 浏览器必须忽略任何经非安全传输收到的 HSTS 头。
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# ---------- 禁止被 iframe 嵌套 ----------
# 控制台里有个「显示一次性管理密钥」的按钮，而密钥**只显示一次**：
# 被任意站点 iframe 嵌套 + 遮罩诱导点击，就能把密钥骗走（点击劫持）。
# 用 `DENY` 而不是 `SAMEORIGIN`：本站没有任何「自己嵌自己」的用法。
# 与 CSP 的 `frame-ancestors 'none'` 同时给 —— 老浏览器只认前者，新标准只认后者。
add_header X-Frame-Options "DENY" always;

# ---------- 禁止 MIME 嗅探 ----------
# 静态产物（/assets/*.js、*.css）全靠它。
# 应用自己也给 JSON / HTML 响应设了同一个头，于是在**代理响应上会出现两次** ——
# 这是有意的，不是重复配置：应用那份保证「直连后端」也安全（本仓库支持不走 nginx 的
# 本地开发），nginx 这份保证「它自己吐出来的静态文件」也安全。两者取值相同，语义无差别。
# ⚠️ 别把它当 bug「去重」掉：删掉任一份都会让对应那条路径失去保护。
add_header X-Content-Type-Options "nosniff" always;

# ---------- 引用信息 ----------
# strict-origin-when-cross-origin：同源发完整 URL、跨源只发 origin、降级（https→http）不发。
#
# ⚠️ 它必须与 `internal/handler/redirect.go` 里 302 那条**取同一个值**：
#    重复的 Referrer-Policy 会被浏览器当成逗号列表、**以最后一条为准**，
#    而 nginx 的 add_header 是追加在上游响应之后的 —— 也就是这一份总是赢。
#    两处取值不一致时，应用里那一行是死代码，并且「读代码以为的策略」与
#    「浏览器实际执行的策略」不是一回事。所以那一行已对齐成同一个值
#    （它对直连后端仍然生效）。
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# ---------- CSP（纵深防御，不是主防线）----------
# 走查未发现 XSS 面（前端模板只做插值，全仓库无 `v-html` / `innerHTML`；
# 后端两张 HTML 页面 `internal/handler/html.go` 走 html/template 渲染，
# 自动转义在场），这条是第二道防线。
#
# `style-src` 里的哈希对应**口令页与短链失效页**那段内联 <style>
# （`internal/handler/html.go` 的 pageCSS —— 那两张页面刻意不引外部 CSS，
#   见该文件里的说明）。哈希**从常量算出来**，不手抄；
# 守卫 `internal/handler/csp_hash_test.go` 会在 pageCSS 改过而哈希没跟着更新时变红 ——
# 否则表现是「口令页突然变成一张没有样式的裸 HTML」，而这种回归不会报任何错，
# 只能靠人眼发现。
#
# 为什么不用 'unsafe-inline'：那等于让「注入一个 <style> 就能覆盖整个界面」重新成立，
# 而对一张要输入口令的页面，这正好可以被拿来做假提示。
#
# 逐条：
#   default-src 'self'   —— 兜底：没单列的指令都只允许同源
#   script-src 'self'    —— Vite 的产物全是外链 ES module，没有内联脚本，因此**不需要**
#                           'unsafe-inline'；也刻意不给 'unsafe-eval'（若某个依赖需要
#                           eval 才能跑，说明它不该进来，宁可让它红）
#   style-src            —— 自己的 CSS + 上面那个内联样式哈希
#   img-src data:        —— 二维码是 canvas 的 toDataURL() 产物（前端 qrcode 生成）
#   font-src 'self'      —— 字体是自托管的 woff2（B1 已子集化，见 README ㉖）
#   connect-src 'self'   —— 全部请求打自己的 /api
#   form-action 'self'   —— 口令页是原生 POST 回 /{code}
#   object-src 'none'    —— 不用任何插件
#   frame-ancestors none —— 与上面的 X-Frame-Options 是同一件事
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'sha256-flAWVL2c5Xmmpi8Barxz9hF5AdzifbuNrxfLZQjQNmU='; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
