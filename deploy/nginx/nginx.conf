# ============================================================
# AshenCourier —— frontend 容器内的 nginx 全量配置
#   - real_ip           → 从 CF-Connecting-IP 恢复真实访客地址（本站前面有 Cloudflare）
#   - /api/*            → backend:8080（反代）
#   - /healthz          → backend:8080
#   - = /metrics        → 404（指标端点不对外，只有内网直连后端才抓得到）
#   - /assets/*         → 本地静态资源（必须早于短码正则，否则会被当成短码）
#   - = /login 等       → index.html（单段 SPA 路由，必须精确匹配，见下）
#   - ^/[A-Za-z0-9_-]{3,32}$ → backend:8080（短码 302 跳转）
#   - /                 → SPA history fallback
#
# location 匹配优先级（nginx 官方规则）：
#   = 精确 → ^~ 前缀 → ~ 正则（按出现顺序）→ 最长普通前缀
#
# ⚠️ 关键推论：正则的优先级高于普通前缀 `location /`。
#    所以「单段的 SPA 顶级路由」（/login、/dashboard）如果不显式处理，
#    会被短码正则截走并打到后端拿 404。它们必须用 `=` 精确匹配拦下来。
# ============================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rid=$http_x_request_id rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml font/woff2;

    # ---------- 上游 DNS：必须用运行时解析 ----------
    # nginx 默认只在启动时解析一次上游主机名。后端容器一旦重建
    # （`docker compose up -d --build backend`），IP 就变了，而 nginx 还黏着旧 IP，
    # 对外表现为持续 502 Bad Gateway —— 且 nginx 自己不会恢复。
    #
    # 解法：proxy_pass 里一旦带变量，nginx 就会走运行时解析（按 valid= 缓存）。
    # 127.0.0.11 是 Docker 内置 DNS。
    #
    # 刻意不用 upstream 块：upstream 的 server 名同样只在启动时解析一次，
    # 要动态化得依赖 nginx 1.27.3+ 的 `server ... resolve` 参数，兼容性更差。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # 用 map 造一个「常量变量」，喂给 proxy_pass 触发运行时解析
    map $host $backend_upstream {
        default backend:8080;
    }

    # 反代到后端的公共头。后端只信任 X-Real-IP，绝不信任可伪造的 X-Forwarded-For。
    # （官方 nginx 镜像里没有 Debian 的 proxy_params 文件，故此处内联。）
    map $http_x_request_id $ac_request_id {
        default   $http_x_request_id;
        ""        $request_id;
    }

    # ---------- 真实客户端 IP：本站部署在 Cloudflare 后面 ----------
    # 没有这一段时 `$remote_addr` 是 Cloudflare 边缘节点的地址，不是访客的。三个后果：
    #   - 按 IP 的限流（创建 10 次/分/IP、登录与解锁各 20 次/10 分/IP）会把
    #     **同一边缘节点下的所有访客算成同一个 IP** —— 一个人刷满，所有人吃 429；
    #   - 点击明细、访问日志、`links.created_ip` 记的都是 CF 节点，排障看不到真实来源；
    #   - 启用 GeoIP 时，按 IP 解析出的「国家」是 CF 机房所在国，不是访客所在国。
    #
    # `set_real_ip_from` 匹配的是**改写前的 TCP 对端地址**，攻击者无法把自己伪造成
    # Cloudflare 的地址（TCP 三次握手做不到），所以这段是安全的；
    # 而它只在「对端确实落在这些段里」时生效，因此**自建（前面没有 CDN）时整段删掉即可**，
    # 删掉后行为与加它之前完全一致。
    #
    # 地址段以 https://www.cloudflare.com/ips/ 为准（厂商会增删，部署后请定期核对）。
    # 本清单取自 2026-09-22 的 ips-v4 / ips-v6：15 个 IPv4 段 + 7 个 IPv6 段。
    #
    # ⚠️ 配套的运维要求（代码管不到，必须做）：**源站只允许 Cloudflare 的地址段访问 80/443**。
    #    后端 `TRUST_PROXY` 默认为 true 且只认 `X-Real-IP`，源站一旦能被直连，
    #    任何人都可以伪造 `X-Real-IP` 绕过限流、并往点击明细里写任意 IP。
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    # `CF-Connecting-IP` 里只有一个地址，所以**不需要** real_ip_recursive：
    # 它的作用是「在 X-Forwarded-For 这类地址列表里继续往后找」，而这里没有列表。
    # 若将来改用 `X-Forwarded-For`，必须同时打开 `real_ip_recursive on` ——
    # 否则会取到列表里的第一个地址，那正是客户端可以随便伪造的位置。
    real_ip_header CF-Connecting-IP;

    server {
        listen       80;
        server_name  _;
        root         /usr/share/nginx/html;
        index        index.html;

        # ---------- 后端 API ----------
        location ^~ /api/ {
            proxy_pass         http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-Id      $ac_request_id;
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # 精确匹配，避免 /api 裸路径掉进短码正则
        location = /api {
            proxy_pass         http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host         $host;
            proxy_set_header   X-Real-IP    $remote_addr;
            proxy_set_header   X-Request-Id $ac_request_id;
        }

        location = /healthz {
            proxy_pass         http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host         $host;
            proxy_set_header   X-Real-IP    $remote_addr;
            proxy_set_header   X-Request-Id $ac_request_id;
            access_log         off;
        }

        # ---------- 指标端点：明确不对外 ----------
        # /metrics 是 7 位、正好落在下面的短码正则 ^/[A-Za-z0-9_-]{3,32}$ 里，
        # 若不显式处理就会被当成短码打到后端 —— 那是「后端能出指标、公网也能读」的最坏组合。
        # `=` 精确匹配优先级最高，必然先于正则命中。
        #
        # 用 return 404 而不是 deny：对外要表达的语义是「这里什么都没有」。
        # 403 等于告诉扫描器「这个路径存在，只是不给你看」，反而指了路。
        # 抓取方走内网直连 backend:8080（compose 网络内部），不经过这里。
        location = /metrics { return 404; }

        # ---------- 静态资源（必须先于短码正则声明）----------
        location ^~ /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /favicon.ico { try_files $uri =404; access_log off; log_not_found off; }
        location = /robots.txt  { try_files $uri =404; access_log off; log_not_found off; }

        # ---------- SPA 顶级路由（单段）----------
        # ⚠️ 这些必须用 `=` 精确匹配，原因见下面的优先级说明：
        #    nginx 的顺序是「= 精确 → ^~ 前缀 → ~ 正则（按书写顺序）→ 最长普通前缀」。
        #    正则一旦命中就赢过 `location /`，所以 /login、/dashboard 这类
        #    「看起来像短码的单段路径」会被短码正则截走，打到后端拿 404。
        #    用 `=` 精确匹配优先级最高，且不会像 `^~ /login` 那样误伤 /loginabc 这种合法短码。
        #
        # 📌 新增前端顶级路由时，本清单、后端 shortcode/reserved.go、
        #    frontend/vite.config.ts 的 SPA_ROUTES 三处要一起改。
        location = /login     { try_files $uri /index.html; }
        location = /register  { try_files $uri /index.html; }
        location = /logout    { try_files $uri /index.html; }
        location = /dashboard { try_files $uri /index.html; }
        location = /links     { try_files $uri /index.html; }
        location = /settings  { try_files $uri /index.html; }
        location = /account   { try_files $uri /index.html; }
        location = /profile   { try_files $uri /index.html; }
        location = /admin     { try_files $uri /index.html; }
        location = /about     { try_files $uri /index.html; }
        location = /help      { try_files $uri /index.html; }
        location = /docs      { try_files $uri /index.html; }
        location = /terms     { try_files $uri /index.html; }
        location = /privacy   { try_files $uri /index.html; }

        # ---------- 短码跳转：3–32 位 [0-9A-Za-z_-] ----------
        # 放在所有静态/API/SPA 精确 location 之后，作为「看起来像短码」的兜底分支。
        # 注意：正则 location 的优先级高于普通前缀 `location /`，所以上面那些
        # `=` 精确匹配不是可选项，是必需的。
        location ~ "^/[A-Za-z0-9_-]{3,32}$" {
            proxy_pass         http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;   # 后端只相信这个头
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-Id      $ac_request_id;
            proxy_intercept_errors off;                          # 302/404/410 原样透传
            proxy_connect_timeout 5s;
            proxy_read_timeout    10s;
        }

        # ---------- SPA history fallback ----------
        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~ /\. { deny all; }
    }
}
