# ============================================================
# AshenCourier —— frontend 容器内的 nginx 全量配置
#   - /api/*            → backend:8080（反代）
#   - /healthz          → backend:8080
#   - /assets/*         → 本地静态资源（必须早于短码正则，否则会被当成短码）
#   - = /login 等       → index.html（单段 SPA 路由，必须精确匹配，见下）
#   - ^/[A-Za-z0-9_-]{3,32}$ → backend:8080（短码 302 跳转）
#   - /                 → SPA history fallback
#
# location 匹配优先级（nginx 官方规则）：
#   = 精确 → ^~ 前缀 → ~ 正则（按出现顺序）→ 最长普通前缀
#
# ⚠️ 关键推论：正则的优先级高于普通前缀 `location /`。
#    所以「单段的 SPA 顶级路由」（/login、/dashboard）如果不显式处理，
#    会被短码正则截走并打到后端拿 404。它们必须用 `=` 精确匹配拦下来。
# ============================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rid=$http_x_request_id rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml font/woff2;

    # ---------- 上游 DNS：必须用运行时解析 ----------
    # nginx 默认只在启动时解析一次上游主机名。后端容器一旦重建
    # （`docker compose up -d --build backend`），IP 就变了，而 nginx 还黏着旧 IP，
    # 对外表现为持续 502 Bad Gateway —— 且 nginx 自己不会恢复。
    #
    # 解法：proxy_pass 里一旦带变量，nginx 就会走运行时解析（按 valid= 缓存）。
    # 127.0.0.11 是 Docker 内置 DNS。
    #
    # 刻意不用 upstream 块：upstream 的 server 名同样只在启动时解析一次，
    # 要动态化得依赖 nginx 1.27.3+ 的 `server ... resolve` 参数，兼容性更差。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # 用 map 造一个「常量变量」，喂给 proxy_pass 触发运行时解析
    map $host $backend_upstream {
        default backend:8080;
    }

    # 反代到后端的公共头。后端只信任 X-Real-IP，绝不信任可伪造的 X-Forwarded-For。
    # （官方 nginx 镜像里没有 Debian 的 proxy_params 文件，故此处内联。）
    map $http_x_request_id $ac_request_id {
        default   $http_x_request_id;
        ""        $request_id;
    }

    server {
        listen       80;
        server_name  _;
        root         /usr/share/nginx/html;
        index        index.html;

        # ---------- 后端 API ----------
        location ^~ /api/ {
            proxy_pass         http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-Id      $ac_request_id;
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # 精确匹配，避免 /api 裸路径掉进短码正则
        location = /api {
            proxy_pass         http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host         $host;
            proxy_set_header   X-Real-IP    $remote_addr;
            proxy_set_header   X-Request-Id $ac_request_id;
        }

        location = /healthz {
            proxy_pass         http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host         $host;
            proxy_set_header   X-Real-IP    $remote_addr;
            proxy_set_header   X-Request-Id $ac_request_id;
            access_log         off;
        }

        # ---------- 静态资源（必须先于短码正则声明）----------
        location ^~ /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /favicon.ico { try_files $uri =404; access_log off; log_not_found off; }
        location = /robots.txt  { try_files $uri =404; access_log off; log_not_found off; }

        # ---------- SPA 顶级路由（单段）----------
        # ⚠️ 这些必须用 `=` 精确匹配，原因见下面的优先级说明：
        #    nginx 的顺序是「= 精确 → ^~ 前缀 → ~ 正则（按书写顺序）→ 最长普通前缀」。
        #    正则一旦命中就赢过 `location /`，所以 /login、/dashboard 这类
        #    「看起来像短码的单段路径」会被短码正则截走，打到后端拿 404。
        #    用 `=` 精确匹配优先级最高，且不会像 `^~ /login` 那样误伤 /loginabc 这种合法短码。
        #
        # 📌 新增前端顶级路由时，本清单、后端 shortcode/reserved.go、
        #    frontend/vite.config.ts 的 SPA_ROUTES 三处要一起改。
        location = /login     { try_files $uri /index.html; }
        location = /register  { try_files $uri /index.html; }
        location = /logout    { try_files $uri /index.html; }
        location = /dashboard { try_files $uri /index.html; }
        location = /links     { try_files $uri /index.html; }
        location = /settings  { try_files $uri /index.html; }
        location = /account   { try_files $uri /index.html; }
        location = /profile   { try_files $uri /index.html; }
        location = /admin     { try_files $uri /index.html; }
        location = /about     { try_files $uri /index.html; }
        location = /help      { try_files $uri /index.html; }
        location = /docs      { try_files $uri /index.html; }
        location = /terms     { try_files $uri /index.html; }
        location = /privacy   { try_files $uri /index.html; }

        # ---------- 短码跳转：3–32 位 [0-9A-Za-z_-] ----------
        # 放在所有静态/API/SPA 精确 location 之后，作为「看起来像短码」的兜底分支。
        # 注意：正则 location 的优先级高于普通前缀 `location /`，所以上面那些
        # `=` 精确匹配不是可选项，是必需的。
        location ~ "^/[A-Za-z0-9_-]{3,32}$" {
            proxy_pass         http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;   # 后端只相信这个头
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-Id      $ac_request_id;
            proxy_intercept_errors off;                          # 302/404/410 原样透传
            proxy_connect_timeout 5s;
            proxy_read_timeout    10s;
        }

        # ---------- SPA history fallback ----------
        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~ /\. { deny all; }
    }
}
