# ============================================================
# AshenCourier —— frontend 容器内的 nginx 全量配置
#   - real_ip           → 从 CF-Connecting-IP 恢复真实访客地址（本站前面有 Cloudflare）
#   - /api/*            → backend:8080（反代）
#   - /healthz          → backend:8080
#   - = /metrics        → 404（指标端点不对外，只有内网直连后端才抓得到）
#   - /assets/*         → 本地静态资源（必须早于短码正则，否则会被当成短码）
#   - = /login 等       → index.html（单段 SPA 路由，必须精确匹配，见下）
#   - = /index.html     → SPA 外壳的**唯一出口**（带 no-cache，所有 SPA 路径最终都落到它）
#   - ^/[A-Za-z0-9_-]{3,32}$ → backend:8080（短码 302 跳转）
#   - /                 → SPA history fallback
#   - 安全响应头         → include security-headers.conf（每个自带 add_header 的层级都要 include，
#                         原因见那个文件顶部：nginx 的 add_header 是替换而不是合并）
#
# location 匹配优先级（nginx 官方规则）：
#   = 精确 → ^~ 前缀 → ~ 正则（按出现顺序）→ 最长普通前缀
#
# ⚠️ 关键推论：正则的优先级高于普通前缀 `location /`。
#    所以「单段的 SPA 顶级路由」（/login、/dashboard）如果不显式处理，
#    会被短码正则截走并打到后端拿 404。它们必须用 `=` 精确匹配拦下来。
# ============================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rid=$http_x_request_id rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml font/woff2;

    # ---------- 上游 DNS：必须用运行时解析 ----------
    # nginx 默认只在启动时解析一次上游主机名。后端容器一旦重建
    # （`docker compose up -d --build backend`），IP 就变了，而 nginx 还黏着旧 IP，
    # 对外表现为持续 502 Bad Gateway —— 且 nginx 自己不会恢复。
    #
    # 解法：proxy_pass 里一旦带变量，nginx 就会走运行时解析（按 valid= 缓存）。
    # 127.0.0.11 是 Docker 内置 DNS。
    #
    # 刻意不用 upstream 块：upstream 的 server 名同样只在启动时解析一次，
    # 要动态化得依赖 nginx 1.27.3+ 的 `server ... resolve` 参数，兼容性更差。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # 用 map 造一个「常量变量」，喂给 proxy_pass 触发运行时解析
    map $host $backend_upstream {
        default backend:8080;
    }

    # 反代到后端的公共头。后端只信任 X-Real-IP，绝不信任可伪造的 X-Forwarded-For。
    # （官方 nginx 镜像里没有 Debian 的 proxy_params 文件，故此处内联。）
    map $http_x_request_id $ac_request_id {
        default   $http_x_request_id;
        ""        $request_id;
    }

    # ---------- 真实客户端 IP：本站部署在 Cloudflare 后面 ----------
    # 没有这一段时 `$remote_addr` 是 Cloudflare 边缘节点的地址，不是访客的。三个后果：
    #   - 按 IP 的限流（创建 10 次/分/IP、登录与解锁各 20 次/10 分/IP）会把
    #     **同一边缘节点下的所有访客算成同一个 IP** —— 一个人刷满，所有人吃 429；
    #   - 点击明细、访问日志、`links.created_ip` 记的都是 CF 节点，排障看不到真实来源；
    #   - 启用 GeoIP 时，按 IP 解析出的「国家」是 CF 机房所在国，不是访客所在国。
    #
    # `set_real_ip_from` 匹配的是**改写前的 TCP 对端地址**，攻击者无法把自己伪造成
    # Cloudflare 的地址（TCP 三次握手做不到），所以这段是安全的；
    # 而它只在「对端确实落在这些段里」时生效，因此**自建（前面没有 CDN）时整段删掉即可**，
    # 删掉后行为与加它之前完全一致。
    #
    # 地址段以 https://www.cloudflare.com/ips/ 为准（厂商会增删，部署后请定期核对）。
    # 本清单取自 2026-09-22 的 ips-v4 / ips-v6：15 个 IPv4 段 + 7 个 IPv6 段。
    #
    # ⚠️ 配套的运维要求（代码管不到，必须做）：**源站只允许 Cloudflare 的地址段访问 80/443**。
    #    后端 `TRUST_PROXY` 默认为 true 且只认 `X-Real-IP`，源站一旦能被直连，
    #    任何人都可以伪造 `X-Real-IP` 绕过限流、并往点击明细里写任意 IP。
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    # `CF-Connecting-IP` 里只有一个地址，所以**不需要** real_ip_recursive：
    # 它的作用是「在 X-Forwarded-For 这类地址列表里继续往后找」，而这里没有列表。
    # 若将来改用 `X-Forwarded-For`，必须同时打开 `real_ip_recursive on` ——
    # 否则会取到列表里的第一个地址，那正是客户端可以随便伪造的位置。
    real_ip_header CF-Connecting-IP;

    server {
        listen       80;
        server_name  _;
        root         /usr/share/nginx/html;
        index        index.html;

        # 安全响应头：单一定义点见同目录的 security-headers.conf（内含「为什么必须 include」的说明）。
        # 放在 server 层 —— 它覆盖静态文件、SPA 外壳、以及**反代回来的响应**（`add_header` 是
        # 响应头过滤器，上游来的响应同样会过一遍），所以 /api/* 与短码跳转也一并带上。
        include /etc/nginx/security-headers.conf;

        # ---------- 后端 API ----------
        location ^~ /api/ {
            proxy_pass         http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-Id      $ac_request_id;
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # 精确匹配，避免 /api 裸路径掉进短码正则
        location = /api {
            proxy_pass         http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host         $host;
            proxy_set_header   X-Real-IP    $remote_addr;
            proxy_set_header   X-Request-Id $ac_request_id;
        }

        location = /healthz {
            proxy_pass         http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host         $host;
            proxy_set_header   X-Real-IP    $remote_addr;
            proxy_set_header   X-Request-Id $ac_request_id;
            access_log         off;
        }

        # ---------- 指标端点：明确不对外 ----------
        # /metrics 是 7 位、正好落在下面的短码正则 ^/[A-Za-z0-9_-]{3,32}$ 里，
        # 若不显式处理就会被当成短码打到后端 —— 那是「后端能出指标、公网也能读」的最坏组合。
        # `=` 精确匹配优先级最高，必然先于正则命中。
        #
        # 用 return 404 而不是 deny：对外要表达的语义是「这里什么都没有」。
        # 403 等于告诉扫描器「这个路径存在，只是不给你看」，反而指了路。
        # 抓取方走内网直连 backend:8080（compose 网络内部），不经过这里。
        location = /metrics { return 404; }

        # ---------- 静态资源（必须先于短码正则声明）----------
        # 内容哈希 ⇒ 可以 immutable；`try_files $uri =404` 是**刻意**不给 fallback 的
        # （一个已经失效的哈希资源必须诚实地 404，而不是悄悄换回 index.html ——
        #   后者会让「前端版本不一致」这类故障永远查不出来）。
        location ^~ /assets/ {
            # ⚠️ 本块自己有 add_header（下面那条缓存头）⇒ server 层那批安全头**不再继承**，
            #    必须在这里重复 include。忘了它就是「页面看着全好、只有安全头静默消失」。
            #    冒烟里有一条断言专门盯这里（内容哈希资源必须**同时**有 immutable 与 nosniff）。
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /favicon.ico { try_files $uri =404; access_log off; log_not_found off; }
        location = /robots.txt  { try_files $uri =404; access_log off; log_not_found off; }

        # ---------- SPA 顶级路由（单段）----------
        # ⚠️ 这些必须用 `=` 精确匹配，原因见下面的优先级说明：
        #    nginx 的顺序是「= 精确 → ^~ 前缀 → ~ 正则（按书写顺序）→ 最长普通前缀」。
        #    正则一旦命中就赢过 `location /`，所以 /login、/dashboard 这类
        #    「看起来像短码的单段路径」会被短码正则截走，打到后端拿 404。
        #    用 `=` 精确匹配优先级最高，且不会像 `^~ /login` 那样误伤 /loginabc 这种合法短码。
        #
        # 📌 下面这份清单必须与 `frontend/src/router/index.ts` 里**真实存在的顶级路由
        #    完全一致**（不多不少），并且与 `frontend/vite.config.ts` 的 SPA_ROUTES 保持一致；
        #    `internal/pkg/shortcode/routes_sync_test.go` 会同时读三个文件做交叉断言。
        #
        # 📌 这里**只列真实页面**。2026-09-22 的审计发现这里曾经多出 10 条
        #    （/logout /settings /account /profile /admin /about /help /docs /terms /privacy），
        #    前端并没有这些页面 —— 它们被 `try_files` 兜到 index.html，于是「不存在的页面」
        #    以 **200** 返回，掩盖了真实的 404。想预留将来要做的页面，正确做法是**等页面做出来
        #    再加这一行**；提前占位只会让状态码说谎。
        #    （这些词在 `shortcode/reserved.go` 里仍然保留：那一份是**超集**，
        #      额外那些是「品牌与合规页」的刻意预留，与本清单不是一回事。）
        location = /login     { try_files $uri /index.html; }
        location = /register  { try_files $uri /index.html; }
        location = /dashboard { try_files $uri /index.html; }
        location = /links     { try_files $uri /index.html; }

        # ---------- SPA 外壳的缓存策略：唯一出口 ----------
        # 为什么只需要这一条 location 就覆盖了**全部** SPA 路径（/ 、/login、/dashboard、
        # /links/{code} 这类深链）：
        #
        #   上面那些 `location = /xxx` 里 `try_files` 的**最后一个参数**不是普通回退，
        #   而是一次**内部重定向**（nginx 的 try_files 语义：最后一个参数一定是
        #   `ngx_http_internal_redirect`），于是 nginx 会拿 `/index.html` **重新做一遍
        #   location 匹配** —— 落到这里的 `=` 精确匹配上。`location /` 那条
        #   `try_files $uri $uri/ /index.html` 同理。所以「返回外壳」这件事只有一个出口，
        #   缓存头写在这里就等于写给了所有入口，**将来新增 SPA 路由也自动生效**。
        #
        # 为什么必须设：没有它时 nginx 只发 ETag/Last-Modified（实测 `Cache-Control` 与
        # `ETag` 都缺），浏览器按启发式规则缓存（约 `(now - Last-Modified) × 10%`），
        # 而 `/assets/` 是内容哈希 + `immutable` 且 `try_files $uri =404` **没有 fallback**：
        # 一次部署之后，手里还开着旧页面的用户会在几分钟到几小时内拿旧外壳去请求
        # **已经不存在的哈希资源**，拿到的是硬 404 —— 结果是**白屏**，不是降级。
        # 这类问题 CI 永远测不出来（每轮 e2e 都是干净浏览器），只有真实用户会话会踩到。
        #
        # `no-cache`（而不是 `no-store`）：允许缓存，但每次使用前必须带条件请求回源验证 ——
        # 内容没变仍是 304，既省流量又不会出现「旧外壳 + 新资源」。
        # 实测（冒烟里那条断言）：/ 、/login、/links/{code}、/index.html 四条路径都带上它。
        location = /index.html {
            # ⚠️ 本块一旦出现 add_header，server 层那批就**不再继承** —— 必须重复 include
            #   （这正是 security-headers.conf 顶部说的那个坑）。守卫会检查这一点。
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        # ---------- 短码跳转：3–32 位 [0-9A-Za-z_-] ----------
        # 放在所有静态/API/SPA 精确 location 之后，作为「看起来像短码」的兜底分支。
        # 注意：正则 location 的优先级高于普通前缀 `location /`，所以上面那些
        # `=` 精确匹配不是可选项，是必需的。
        location ~ "^/[A-Za-z0-9_-]{3,32}$" {
            proxy_pass         http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;   # 后端只相信这个头
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-Id      $ac_request_id;
            proxy_intercept_errors off;                          # 302/404/410 原样透传
            proxy_connect_timeout 5s;
            proxy_read_timeout    10s;
        }

        # ---------- SPA history fallback ----------
        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~ /\. { deny all; }
    }
}
