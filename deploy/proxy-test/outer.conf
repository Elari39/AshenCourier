events {}
http {
 resolver 127.0.0.11 ipv6=off;
 # The test edge simulates Cloudflare. Production uses the official IP ranges.
 set_real_ip_from 172.30.84.4;
 real_ip_header CF-Connecting-IP;
 server { listen 80; location / {
  set $upstream frontend:80;
  proxy_pass http://$upstream;
  proxy_set_header Host shorten.miku831.fun;
  proxy_set_header X-Real-IP $remote_addr;
  # This HTTP fixture simulates TLS termination at the outer proxy.
  proxy_set_header X-Forwarded-Proto https;
 } }
}
