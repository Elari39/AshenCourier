# ============================================================
# AshenCourier —— 生产形态一键部署
#   cp .env.example .env   # 填好 POSTGRES_PASSWORD / REDIS_PASSWORD / JWT_SECRET
#   docker compose up -d --build
#   → http://localhost:8080
#
# 要求：Docker Compose v2+（本项目不使用顶层 version: 字段）
# ============================================================

# 后端 / worker 共用同一套环境变量（YAML 锚点复用）
x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # 国家库文件在**容器内**的路径。默认留空 = 不启用国家维度：
  # 这样新克隆的仓库启动时只打一条 info，而不是因为「目录挂进来了但文件还没有」而 warn。
  # 启用方式：把 mmdb 放进 ./deploy/geoip/，然后在这里指向 /geoip/<文件名>。
  GEOIP_DB_PATH: ${GEOIP_DB_PATH:-}
  # 是否允许短链目标指向内网/回环地址。默认 false（拒绝）：
  # 公网短链被拿来把访问者的浏览器指向 127.0.0.1 / 192.168.x /
  # 169.254.169.254（云元数据）是最廉价的一类滥用。
  # ⚠️ 内网部署**必须**设成 true，否则一切创建都会拿到「不支持指向内网或本机的地址」。
  # 只影响创建与修改，跳转路径不做这个判定 —— 收紧策略不该让历史链接失效。
  ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
  # Go 的 GC 软内存上限（B5 的配套）。容器硬上限（deploy.resources.limits.memory）
  # 单独存在时，Go 运行时并不知道它 —— 堆一直涨到被 cgroup **OOM kill**，
  # 表现为「进程无故重启」。GOMEMLIMIT 让它在触界前先做 GC：代价是 GC 变频繁
  # （CPU 涨），收益是从「被杀」变成「变慢」，而变慢是可观测、可告警的。
  #
  # 取容器上限的 ~90%：backend / worker 的 memory 都是 512m ⇒ 460MiB。
  # ⚠️ 两者是**耦合**的：改上面的 memory 时这里要跟着改。
  # 显式写出来而不是指望运行时自动推导 —— 无论 Go 版本怎么变，这个数值都由
  # 这一行决定，排障时不用去猜运行时行为。
  GOMEMLIMIT: ${GOMEMLIMIT:-460MiB}

# backend / worker 共用同一份**构建**定义（YAML 锚点复用）
#
# 这不只是省几行：两个服务必须从同一份 Dockerfile、同样的 build args 构建 ——
# 否则会漂移成「一个跑新代码、一个跑旧代码」（README「九条踩过的坑」第 4 条，
# 守卫见 deploy/check-image-drift.mjs）。用锚点把「同源」写进配置本身：
# 将来要改 context / args，只可能改这一处，不会只改一半。
x-backend-build: &backend-build
  context: ./backend
  args:
    # 版本号注入：Dockerfile 里的 `ARG VERSION=dev` 落到 `-X main.version=`。
    # 不传 = "dev"（本地开发的合理默认）；**生产构建时务必设 APP_VERSION**，
    # 例如：APP_VERSION=$(git describe --tags --always) docker compose up -d --build
    # 它是 /healthz/details 的 `version` 与 /metrics 的
    # `ashen_build_info{version="…"}` 的唯一来源 —— 排障时要确认「线上跑的是哪一版」
    # 只能靠它（A9：线上曾长期是 "dev"，「版本可定位」的承诺等于落空）。
    VERSION: ${APP_VERSION:-dev}

# ------------------------------------------------------------
# 资源上界（B5）：容器这一层也要有上界
#
# README 把「跳转 / 统计」的内存面控制得很细（有界队列 + 队满即丢 + 计数），
# 唯独漏了**容器这一层** —— 原先一个 limit 都没有，于是任何一处失控都能把宿主
# 内存吃满，连带把同机的 PostgreSQL 拖进 OOM（症状是整站不可用，而不只是坏掉
# 一个容器）。
#
# 取值依据：**空闲实测**（`docker stats --no-stream`）backend 约 3–7M / worker 约 3M /
# frontend 约 8M / postgres 约 27–36M / redis 约 6–13M —— 同一次 `up -d` 之后
# 不同时刻量到的值本来就会变（日志缓冲、GC 时机、连接数都会动），所以下面的数值
# 是**量级上的上界**、不是精确倍数：对空闲值留有 30 倍以上余量。要求只有两条：
# 真实负载下跑得住；真失控时表现为**这一个容器被 kill**，而不是宿主被吃满。
#
# 用 `deploy.resources.limits` 而不是旧的 `mem_limit` / `cpus`：前者是 Compose
# 规范里的写法，`docker compose up` 照常应用（并非只有 swarm 才认）。
# 实测见 README 验收记录 ㊷（`docker inspect` 的 HostConfig.Memory / NanoCpus
# 确实被设置）。
#
# 刻意**不加 `pids_limit`**：backend / worker 是单进程 Go（几乎不 fork），
# 而 PostgreSQL 在 `max_connections=100` 时会**合法地**用到 100+ 进程 ——
# 一个统一的 pids_limit 要么形同虚设、要么在正常负载下误杀 PG。
# 守卫一个具体数值容易，守卫「为什么是这个数值」很难，所以宁可不加。

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ashen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ashen
    volumes:
      # ⚠️ PG18 起默认数据目录变为 /var/lib/postgresql/18/docker，
      #    必须挂父目录 /var/lib/postgresql —— 挂旧的 .../data 路径容器会直接启动失败
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ashen -d ashen"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # 1G 是给 shared_buffers（镜像默认 128MB）+ 每个连接的 work_mem + 排序/哈希
    # 留的余量。空闲只占 35M，但**故意不按空闲值设** —— 先把 PG 卡死就会把 API
    # 一起拖垮（它每个请求都要连库），那比「某个容器被 kill」严重得多。
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    restart: unless-stopped

  redis:
    image: redis:8.10-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redisdata:/data
    healthcheck:
      # $$ 转义：让 $REDIS_PASSWORD 在容器内展开，而不是被 compose 插值
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    # 只给容器上界，**刻意不设 `--maxmemory`**：Stream 里是尚未 ACK 的点击，
    # 一旦配上淘汰策略（就算 noeviction，写失败同样会丢新点击），症状就从
    # 「内存被限住」变成「静默少记数据」。内存面在别处已经收过口
    # （`XADD ... MAXLEN ~ 100000` 兜住 Stream），这里只兜住容器。
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
    restart: unless-stopped

  # 一次性任务：迁移跑完即退出
  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./backend/migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "${DATABASE_URL:?DATABASE_URL is required}", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    # 与 worker 共用同一份构建定义（见文件顶部的 x-backend-build）
    build: *backend-build
    environment:
      <<: *backend-env
      HTTP_ADDR: ":8080"
      WORKER_ENABLED: "false" # 生产由独立 worker 容器承担
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      # 国家库文件放宿主的 ./deploy/geoip/（*.mmdb 已被 .gitignore 忽略，
      # 它是外部数据不是源码）。只读挂载：进程只查询，不需要写。
      - ./deploy/geoip:/geoip:ro
    expose:
      - "8080"
    # 空闲 6.8M；512m 是上界而非常态。api 是唯一对外接流量的进程，
    # 给到 2 CPU 让它能在尖峰时吃完配额（PG 那边也留了 2 CPU，避免互相饿死）。
    # GOMEMLIMIT 在 x-backend-env 里（与这里的 memory 耦合，改动要一起改）。
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512m
    restart: unless-stopped

  worker:
    # 与 backend 共用同一份构建定义（见文件顶部的 x-backend-build）
    build: *backend-build
    # ⚠️ 必须用 entrypoint 覆盖，不能用 command：
    #    Dockerfile 里是 exec 形式的 ENTRYPOINT ["/app/api"]，
    #    而 compose 的 command 只会成为 ENTRYPOINT 的**参数**，
    #    写成 command 会真正启动 `/app/api /app/worker` —— 变成第二个 API 进程，
    #    只是恰好因为 WORKER_ENABLED 被顺带打开才显得「能跑」。
    entrypoint: ["/app/worker"]
    # 覆盖镜像里的默认健康检查（那是给 api 用的 /app/api -healthcheck）；
    # worker 没有 HTTP 端口，用自己的探针去 ping PG / Redis
    healthcheck:
      test: ["CMD", "/app/worker", "-healthcheck"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 10s
    environment:
      <<: *backend-env
    volumes:
      # 与 backend 同一份挂载：worker 才是真正解析国家的那一方
      - ./deploy/geoip:/geoip:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # 空闲 3.6M。CPU 只给 1：worker 是每 2 秒一轮的批量回刷，不参与对外延迟，
    # 给多了只会和 api / PG 抢核（单机部署下这三者共享同一批 CPU）。
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
    restart: unless-stopped

  frontend:
    build:
      # 上下文是仓库根目录：镜像需要同时拿到 frontend/ 源码与 deploy/nginx/nginx.conf。
      # 单独构建用：docker build -f frontend/Dockerfile .
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # 短链基址：默认与后端 PUBLIC_BASE_URL 取同一个值（同源部署下两者本就相同）。
        # 留空时前端回退到 window.location.origin。⚠️ 构建期注入，改它要重新 build。
        VITE_SHORT_BASE_URL: ${PUBLIC_BASE_URL:-}
    ports:
      - "${FRONTEND_PORT:-8080}:80" # 对外唯一入口
    depends_on:
      - backend
    # 空闲 8.8M：nginx 只发静态文件与反代。256m 足够几百个并发连接
    # （每个连接的头/缓冲区是 KB 级）；给 1 CPU 是因为它的瓶颈在 TLS/网络，
    # 不在计算。
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m
    restart: unless-stopped

  # ----------------------------------------------------------
  # 备份（可选，ops profile）：默认不启动
  #   docker compose --profile ops up -d backup
  #
  # 为什么用与服务端同一个 tag：pg_dump 的主版本必须 ≥ 服务端主版本，
  # 版本倒挂会直接报「server version mismatch」。
  #
  # 演练命令见 README「备份与恢复演练」——备份没恢复过就等于没有备份。
  # ----------------------------------------------------------
  backup:
    image: postgres:18.6-alpine
    profiles: ["ops"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./deploy/backup:/backup
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          if pg_dump -h postgres -U ashen -d ashen -Fc -f "/backup/ashen-$$(date +%Y%m%d-%H%M%S).dump"; then
            echo "备份完成：$$(ls -1t /backup/ashen-*.dump | head -1)"
            find /backup -name 'ashen-*.dump' -mtime +14 -delete
            sleep 86400
          else
            echo "pg_dump 失败，60 秒后重试" >&2
            sleep 60
          fi
        done
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
